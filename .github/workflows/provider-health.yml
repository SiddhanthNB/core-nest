name: Provider Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # external client against the deployed API; provider/DB/Redis secrets live only on Render
      CORE_NEST_URL: https://core-nest.onrender.com
      CORE_NEST_API_KEY: ${{ secrets.CORE_NEST_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Run provider health check
        run: uv run scripts/provider_health.py
